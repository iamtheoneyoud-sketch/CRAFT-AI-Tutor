<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071418">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="CRAFT AI Tutor — a living Wuxia learning realm for concept mastery, recall, application and research.">
  <title>CRAFT AI Tutor — Wuxia Learning Realm</title>

  <style>
    :root {
      --ink: #f4f0e6;
      --ink-soft: rgba(244,240,230,.72);
      --ink-faint: rgba(244,240,230,.48);
      --jade: #93d8c0;
      --jade-bright: #b8f0dc;
      --cyan: #77dce2;
      --cyan-soft: rgba(119,220,226,.16);
      --sakura: #ef9cc7;
      --sakura-soft: rgba(239,156,199,.16);
      --gold: #c5a059;
      --gold-bright: #e4cb90;
      --gold-soft: rgba(197,160,89,.18);
      --deep: #061016;
      --glass: rgba(4, 16, 18, .52);
      --glass-strong: rgba(4, 13, 17, .72);
      --line: rgba(197,160,89,.28);
      --line-soft: rgba(220,244,236,.12);
      --danger: #e7a4a4;
      --shadow: 0 28px 90px rgba(0,0,0,.42);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --mouse-x: 0px;
      --mouse-y: 0px;
      --bg-scale: 1.06;
    }

    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      min-height: 100%;
      overflow: hidden;
      color: var(--ink);
      background: #030a0d;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: .01em;
    }

    button, textarea, select, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }

    .world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #02070a;
      isolation: isolate;
    }

    .world-canvas {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      z-index: 0;
      transform: translate3d(var(--mouse-x), var(--mouse-y), 0) scale(var(--bg-scale));
      transform-origin: center center;
      will-change: transform;
      filter: saturate(1.03) contrast(1.02);
    }

    .world::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 22%, rgba(225,248,242,.10), transparent 34%),
        linear-gradient(180deg, rgba(3,8,11,.16) 0%, rgba(1,7,9,.10) 42%, rgba(2,8,9,.55) 100%),
        linear-gradient(90deg, rgba(1,7,10,.40), transparent 18%, transparent 82%, rgba(1,7,10,.35));
      mix-blend-mode: normal;
    }

    .atmosphere {
      position:absolute;
      inset:0;
      z-index:2;
      pointer-events:none;
    }

    .mist-band {
      position:absolute;
      width: 55vw;
      height: 18vh;
      min-width: 360px;
      min-height: 120px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 50%, rgba(230,250,242,.15), rgba(121,192,187,.05) 50%, transparent 72%);
      filter: blur(26px);
      opacity: .8;
      animation: mistDrift 24s ease-in-out infinite alternate;
    }
    .mist-a { left: 7%; top: 30%; }
    .mist-b { right: 4%; top: 49%; width: 42vw; animation-duration: 32s; animation-delay: -8s; }
    .mist-c { left: 25%; bottom: 4%; width: 58vw; opacity: .42; animation-duration: 28s; animation-delay: -14s; }

    .realm-vignette {
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 52%, transparent 0 38%, rgba(0,0,0,.20) 75%, rgba(0,0,0,.48) 100%);
      pointer-events:none;
    }

    .petal-layer {
      position:absolute;
      inset:0;
      z-index: 9;
      overflow:hidden;
      pointer-events:none;
    }
    .petal {
      position:absolute;
      top:-30px;
      left:0;
      width: 11px;
      height: 17px;
      border-radius: 70% 22% 70% 22%;
      background: linear-gradient(145deg, rgba(255,220,238,.96), rgba(214,119,171,.9));
      box-shadow: 0 0 9px rgba(244,163,209,.18);
      opacity: 0;
      animation: petalFall var(--fall, 12s) linear forwards;
      transform-origin: center;
    }
    .petal::after {
      content:"";
      position:absolute;
      inset: 2px 5px 3px 3px;
      border-radius:50%;
      background: rgba(255,245,251,.58);
      filter: blur(.5px);
    }

    .shell {
      position:relative;
      z-index:10;
      display:grid;
      grid-template-columns: 276px minmax(0,1fr);
      gap: 14px;
      width:100%;
      height:100%;
      padding: 14px;
    }

    .glass {
      background: linear-gradient(180deg, rgba(7,20,23,.56), rgba(3,12,15,.65));
      border: 1px solid var(--line);
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(22px) saturate(135%);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
    }

    .sidebar {
      display:flex;
      flex-direction:column;
      min-height:0;
      border-radius: var(--radius-xl);
      padding: 18px;
      overflow:hidden;
    }

    .brand {
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 4px 4px 16px;
    }

    .brand-mark {
      width:48px;
      height:48px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      color: var(--gold-bright);
      border:1px solid rgba(197,160,89,.46);
      background:
        radial-gradient(circle at 35% 30%, rgba(255,228,167,.22), transparent 44%),
        linear-gradient(145deg, rgba(197,160,89,.18), rgba(86,145,132,.10));
      box-shadow: 0 0 32px rgba(197,160,89,.10);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 20px;
    }

    .brand h1 {
      margin:0;
      font-size: 15px;
      letter-spacing:.16em;
      font-weight: 700;
      text-transform:uppercase;
      font-family: Georgia, "Times New Roman", serif;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--ink-faint);
      font-size: 11px;
      line-height:1.35;
    }

    .side-divider {
      height:1px;
      background: linear-gradient(90deg, transparent, rgba(197,160,89,.34), transparent);
      margin: 4px 0 14px;
    }

    .new-chat {
      width:100%;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border:1px solid rgba(197,160,89,.34);
      border-radius: 15px;
      padding: 11px 13px;
      background: linear-gradient(180deg, rgba(197,160,89,.13), rgba(197,160,89,.05));
      cursor:pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .new-chat:hover {
      transform: translateY(-1px);
      border-color: rgba(228,203,144,.64);
      box-shadow: 0 10px 30px rgba(197,160,89,.12);
    }

    .side-title {
      margin: 20px 4px 8px;
      color: var(--ink-faint);
      font-size: 10px;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .realm-list {
      display:grid;
      gap:7px;
    }
    .realm-btn {
      border:1px solid transparent;
      background: rgba(255,255,255,.025);
      padding: 10px 11px;
      border-radius: 13px;
      text-align:left;
      cursor:pointer;
      color: rgba(244,240,230,.72);
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }
    .realm-btn:hover,
    .realm-btn.active {
      background: rgba(119,220,226,.075);
      border-color: rgba(119,220,226,.18);
      color: var(--ink);
    }

    .mastery-card {
      margin-top:auto;
      border-radius: 17px;
      padding: 13px;
      background:
        radial-gradient(circle at 80% 10%, rgba(239,156,199,.10), transparent 42%),
        rgba(255,255,255,.025);
      border:1px solid var(--line-soft);
    }
    .mastery-head {
      display:flex;
      justify-content:space-between;
      gap:8px;
      font-size:11px;
      color:var(--ink-soft);
    }
    .mastery-head strong { color: var(--gold-bright); }
    .mastery-bar {
      height:5px;
      margin-top:9px;
      border-radius:999px;
      background: rgba(255,255,255,.05);
      overflow:hidden;
    }
    .mastery-fill {
      width: 58%;
      height:100%;
      border-radius:999px;
      background: linear-gradient(90deg, var(--gold), var(--jade), var(--cyan));
      box-shadow: 0 0 13px rgba(119,220,226,.18);
    }

    .main {
      min-width:0;
      min-height:0;
      display:flex;
      flex-direction:column;
      border-radius: var(--radius-xl);
      overflow:hidden;
    }

    .topbar {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding: 14px 17px;
      border-bottom:1px solid var(--line-soft);
      background: linear-gradient(180deg, rgba(4,15,18,.52), rgba(4,15,18,.28));
    }

    .topbar-left {
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .mobile-menu {
      display:none;
      width:38px;
      height:38px;
      border-radius:12px;
      border:1px solid var(--line-soft);
      background:rgba(255,255,255,.035);
      cursor:pointer;
    }

    .status-orb {
      width:10px;
      height:10px;
      border-radius:50%;
      background: var(--jade-bright);
      box-shadow: 0 0 18px rgba(184,240,220,.64);
    }

    .realm-heading {
      min-width:0;
    }
    .realm-heading h2 {
      margin:0;
      font-size:14px;
      letter-spacing:.02em;
    }
    .realm-heading span {
      display:block;
      margin-top:2px;
      color: var(--ink-faint);
      font-size:10px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .controls {
      display:flex;
      align-items:center;
      gap:8px;
    }

    .ai-select {
      min-width: 160px;
      border:1px solid rgba(197,160,89,.30);
      border-radius:12px;
      color: var(--gold-bright);
      background: rgba(4,14,17,.58);
      padding:9px 33px 9px 11px;
      outline:none;
      cursor:pointer;
      font-size:11px;
      font-weight:700;
    }
    .ai-select:focus {
      border-color: rgba(228,203,144,.75);
      box-shadow: 0 0 0 3px rgba(197,160,89,.08);
    }
    .ai-select option {
      background:#081116;
      color:#f2ead9;
    }

    .chat-scroll {
      flex:1;
      min-height:0;
      overflow:auto;
      padding: 26px clamp(12px, 4vw, 54px) 18px;
      scroll-behavior:smooth;
    }
    .chat-scroll::-webkit-scrollbar { width:7px; }
    .chat-scroll::-webkit-scrollbar-track { background:transparent; }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(197,160,89,.24);
      border-radius:999px;
    }

    .welcome {
      max-width: 920px;
      margin: 5vh auto 28px;
      text-align:center;
      padding: 28px 24px 22px;
      border-radius: 26px;
      border:1px solid rgba(197,160,89,.25);
      background:
        radial-gradient(circle at 50% 0%, rgba(119,220,226,.09), transparent 42%),
        rgba(4,13,17,.33);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .welcome-mark {
      width:54px;
      height:54px;
      margin:0 auto 14px;
      display:grid;
      place-items:center;
      border-radius:50%;
      border:1px solid rgba(197,160,89,.42);
      background:radial-gradient(circle at 35% 28%, rgba(255,226,169,.20), rgba(197,160,89,.05) 52%, transparent 70%);
      color:var(--gold-bright);
      font-family: Georgia, "Times New Roman", serif;
      font-size:22px;
      box-shadow: 0 0 35px rgba(197,160,89,.10);
    }
    .welcome .eyebrow {
      margin:0;
      font-size:10px;
      letter-spacing:.24em;
      color:var(--gold-bright);
      text-transform:uppercase;
    }
    .welcome h3 {
      margin:11px auto 9px;
      max-width: 760px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(26px, 4vw, 44px);
      line-height:1.04;
      font-weight:600;
      text-shadow: 0 8px 35px rgba(0,0,0,.28);
    }
    .welcome p {
      margin:0 auto;
      max-width:690px;
      color:var(--ink-soft);
      line-height:1.65;
      font-size:13px;
    }

    .prompt-row {
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:8px;
      margin-top:19px;
    }
    .prompt-chip {
      border:1px solid rgba(184,240,220,.15);
      border-radius:999px;
      padding:8px 11px;
      background:rgba(255,255,255,.028);
      color:rgba(244,240,230,.76);
      cursor:pointer;
      font-size:11px;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .prompt-chip:hover {
      transform:translateY(-1px);
      border-color:rgba(184,240,220,.32);
      background:rgba(184,240,220,.06);
    }

    .messages {
      max-width: 960px;
      margin:0 auto;
    }

    .message {
      display:grid;
      grid-template-columns: 40px minmax(0,1fr);
      gap:12px;
      margin-bottom:21px;
      animation: burnIn .72s cubic-bezier(.2,.9,.2,1) both;
    }
    .message.user {
      grid-template-columns: minmax(0,1fr) 40px;
    }
    .message.user .avatar { order:2; }
    .message.user .message-body { order:1; justify-self:end; max-width: 78%; }

    .avatar {
      width:38px;
      height:38px;
      border-radius:14px;
      display:grid;
      place-items:center;
      flex-shrink:0;
      border:1px solid rgba(197,160,89,.30);
      background:rgba(6,17,20,.60);
      color:var(--gold-bright);
      font-family:Georgia, "Times New Roman", serif;
      font-weight:700;
    }
    .avatar.ai {
      background:
        radial-gradient(circle at 30% 25%, rgba(228,203,144,.20), transparent 46%),
        linear-gradient(145deg, rgba(197,160,89,.16), rgba(119,220,226,.07));
      box-shadow: 0 0 28px rgba(197,160,89,.07);
    }
    .avatar.user {
      color:#fbeaf4;
      border-color:rgba(239,156,199,.22);
      background:linear-gradient(145deg, rgba(239,156,199,.14), rgba(7,17,20,.55));
    }

    .message-body {
      min-width:0;
      max-width: 88%;
    }

    .message-meta {
      margin:2px 0 6px;
      color:var(--ink-faint);
      font-size:9px;
      letter-spacing:.15em;
      text-transform:uppercase;
    }
    .message-text {
      padding: 12px 14px;
      border-radius: 17px;
      border:1px solid rgba(255,255,255,.06);
      background: rgba(3,11,14,.37);
      color:var(--ink);
      line-height:1.76;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap:anywhere;
      text-shadow: 0 0 9px rgba(255,206,120,.08);
    }
    .message.assistant .message-text {
      border-color: rgba(197,160,89,.20);
      background:
        radial-gradient(circle at 12% 0%, rgba(197,160,89,.07), transparent 32%),
        rgba(4,13,16,.44);
    }
    .message.user .message-text {
      border-color: rgba(239,156,199,.13);
      background: rgba(19,11,18,.38);
      color:#f5eaf0;
    }

    .composer-wrap {
      padding: 10px clamp(12px, 4vw, 54px) 14px;
      background: linear-gradient(180deg, rgba(4,14,17,0), rgba(3,11,14,.48));
    }

    .composer {
      max-width: 960px;
      margin:0 auto;
      border-radius: 20px;
      border:1px solid rgba(197,160,89,.30);
      background:
        linear-gradient(180deg, rgba(8,18,21,.66), rgba(3,12,15,.75));
      box-shadow: 0 18px 50px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.04);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    .composer:focus-within {
      border-color: rgba(228,203,144,.62);
      box-shadow: 0 18px 60px rgba(0,0,0,.32), 0 0 0 3px rgba(197,160,89,.06);
    }

    .composer textarea {
      display:block;
      width:100%;
      min-height:56px;
      max-height:190px;
      resize:none;
      border:0;
      outline:0;
      background:transparent;
      color:var(--ink);
      padding: 16px 16px 8px;
      line-height:1.5;
      font-size:14px;
    }
    .composer textarea::placeholder { color:rgba(244,240,230,.38); }

    .composer-bar {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 7px 9px 9px 13px;
    }

    .composer-hint {
      color:var(--ink-faint);
      font-size:10px;
    }

    .send-btn {
      border:1px solid rgba(197,160,89,.44);
      border-radius:13px;
      padding:9px 13px;
      min-width:76px;
      cursor:pointer;
      color:#09100f;
      font-weight:800;
      background:linear-gradient(145deg, #e5cf95, #b68c3f);
      box-shadow: 0 7px 24px rgba(197,160,89,.17);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    .send-btn:hover { transform:translateY(-1px); filter:brightness(1.04); box-shadow:0 10px 28px rgba(197,160,89,.23); }
    .send-btn:disabled { opacity:.55; cursor:wait; transform:none; }

    .composer-note {
      margin-top:8px;
      text-align:center;
      color:rgba(244,240,230,.33);
      font-size:9px;
      letter-spacing:.03em;
    }

    .qi {
      position:fixed;
      left:0;
      top:0;
      width:14px;
      height:14px;
      border-radius:50%;
      pointer-events:none;
      z-index:50;
      transform:translate3d(-50%,-50%,0);
      background:radial-gradient(circle, rgba(221,255,247,.98) 0 22%, rgba(119,220,226,.88) 30%, rgba(119,220,226,0) 72%);
      box-shadow: 0 0 20px rgba(119,220,226,.8);
      mix-blend-mode:screen;
    }
    .qi-trail {
      position:fixed;
      width:8px;
      height:8px;
      left:0;
      top:0;
      border-radius:50%;
      pointer-events:none;
      z-index:49;
      transform:translate3d(-50%,-50%,0);
      background:rgba(183,240,220,.75);
      box-shadow:0 0 15px rgba(183,240,220,.65);
      animation: qiFade .56s ease-out forwards;
      mix-blend-mode:screen;
    }

    .loader {
      position:fixed;
      inset:0;
      z-index:100;
      background:#000;
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .loader-inner {
      position:absolute;
      inset:-12%;
      background:#000;
      transition:opacity .9s ease;
    }
    .slash {
      position:absolute;
      width:135vw;
      height:3px;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%) rotate(-29deg) scaleX(0);
      transform-origin:center;
      background:linear-gradient(90deg, transparent, rgba(205,244,255,.55) 19%, #f6ffff 49%, rgba(159,225,255,.75) 78%, transparent);
      box-shadow:0 0 8px #d7f7ff, 0 0 28px rgba(85,210,255,.8), 0 0 80px rgba(85,210,255,.38);
      animation: slashCut 1.05s cubic-bezier(.65,.02,.2,.98) .22s forwards;
    }
    .slash::after {
      content:"";
      position:absolute;
      left:0;
      top:50%;
      width:100%;
      height:22px;
      transform:translateY(-50%);
      background:linear-gradient(90deg, transparent, rgba(148,227,255,.19), transparent);
      filter:blur(10px);
    }
    .loader-mark {
      position:relative;
      z-index:2;
      color:rgba(228,203,144,.9);
      font-family:Georgia, "Times New Roman", serif;
      font-size:13px;
      letter-spacing:.28em;
      text-transform:uppercase;
      opacity:.0;
      animation: loaderText .8s ease .35s forwards;
    }
    .loader.done { pointer-events:none; animation: loaderOut .8s ease forwards; animation-delay:1.08s; }
    .app {
      position:relative;
      z-index:3;
      opacity:0;
      animation: appReveal 1.5s ease 1.05s forwards;
    }

    .error-note {
      color:var(--danger) !important;
      border-color:rgba(231,164,164,.24) !important;
    }

    @keyframes burnIn {
      0% {
        opacity:0;
        transform:translateY(12px) scale(.985);
        filter:blur(8px) brightness(1.7);
        text-shadow: 0 0 20px rgba(255,215,123,.8);
      }
      45% {
        opacity:1;
        filter:blur(1px) brightness(1.22);
        text-shadow: 0 0 12px rgba(255,215,123,.4);
      }
      100% {
        opacity:1;
        transform:none;
        filter:none;
        text-shadow:0 0 7px rgba(255,206,120,.08);
      }
    }
    @keyframes slashCut {
      0% { transform:translate(-50%,-50%) rotate(-29deg) scaleX(0); opacity:0; }

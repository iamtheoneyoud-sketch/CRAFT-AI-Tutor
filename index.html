<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT AI - VIP Wuxia Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Premium Wuxia Color Palette */
        :root {
            --bg-deep: #050505;
            --bg-chat: #0a0a0c;
            --gold-accent: #d4af37;
            --gold-dim: #8c7326;
            --red-wuxia: #8b0000;
            --text-main: #e2dcd0;
            --text-muted: #888378;
            --msg-user: #141416;
            --msg-ai: #0a0a0c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif; /* Clean ChatGPT-like font */
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Animated Qi Particles Background */
        #particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        /* Top Navigation Bar - ChatGPT Style but Wuxia */
        .top-bar {
            position: relative;
            z-index: 10;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.15);
            background: rgba(5, 5, 5, 0.8);
            backdrop-filter: blur(10px);
        }

        /* 3 AI Selector Dropdown */
        .ai-selector {
            background: transparent;
            color: var(--gold-accent);
            border: 1px solid var(--gold-dim);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            appearance: none;
            text-align: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
        }

        .ai-selector:hover {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            border-color: var(--gold-accent);
        }

        .ai-selector option {
            background: var(--bg-deep);
            color: var(--gold-accent);
        }

        /* Chat Container - Clean & Centered */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            position: relative;
            z-index: 5;
            padding-bottom: 120px; /* Space for input */
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--gold-dim);
            border-radius: 10px;
        }

        /* Message Layout (ChatGPT Style) */
        .message-wrapper {
            padding: 24px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            animation: fadeIn 0.5s ease forwards;
        }

        .message-wrapper.ai { background-color: var(--msg-ai); }
        .message-wrapper.user { background-color: var(--msg-user); }

        .message-content {
            max-width: 750px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
            line-height: 1.7;
            font-size: 1rem;
        }

        /* Avatars */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .user-avatar {
            background: var(--red-wuxia);
            color: white;
            border: 1px solid #ff4d4d;
        }

        .ai-avatar {
            background: linear-gradient(135deg, #d4af37, #8c7326);
            color: black;
            font-family: 'Cinzel', serif;
            font-weight: bold;
        }

        .text {
            flex: 1;
            color: var(--text-main);
            padding-top: 4px;
        }

        /* Input Area - Centered at bottom */
        .input-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 30px 20px;
            background: linear-gradient(0deg, var(--bg-deep) 60%, transparent 100%);
            z-index: 10;
            display: flex;
            justify-content: center;
        }

        .input-box {
            max-width: 750px;
            width: 100%;
            position: relative;
            background: #1a1a1e;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: border-color 0.3s ease;
        }

        .input-box:focus-within {
            border-color: var(--gold-accent);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px 50px 16px 20px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-box input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            background: var(--gold-accent);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .send-btn:hover {
            background: #f1c40f;
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--gold-accent);
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
            fill: black;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <!-- Animated Glowing Particles (Qi) -->
    <canvas id="particles"></canvas>

    <!-- Header with 3 AI Model Selector -->
    <div class="top-bar">
        <select class="ai-selector" id="aiModelSelector">
            <option value="grandmaster">✦ Grandmaster AI (Deep Wisdom) ✦</option>
            <option value="scholar">✦ Scholar AI (Quick Speed) ✦</option>
            <option value="warrior">✦ Warrior AI (Direct Answers) ✦</option>
        </select>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-container" id="chatBox">
        <!-- Initial Welcome Message -->
        <div class="message-wrapper ai">
            <div class="message-content">
                <div class="avatar ai-avatar">☯</div>
                <div class="text">
                    Greetings. The scrolls are open. Which technique or knowledge do you seek today?
                </div>
            </div>
        </div>
    </div>

    <!-- ChatGPT Style Input Area -->
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Message CRAFT AI..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <script>
        // --- Spiritual Qi Particles Animation (Wuxia Feel) ---
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = (Math.random() * 1) - 0.5;
                this.opacity = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.y -= this.speedY;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        function initParticles() {
            for (let i = 0; i < 50; i++) particlesArray.push(new Particle());
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // --- Chat Logic ---
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();
            const selectedAI = document.getElementById('aiModelSelector').value; // Reads the 3 AI option

            if (!text) return;

            // 1. Add User Message
            const userHTML = `
                <div class="message-wrapper user">
                    <div class="message-content">
                        <div class="avatar user-avatar">You</div>
                        <div class="text">${text}</div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', userHTML);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 2. Add Loading Message
            const loadingId = 'loading-' + Date.now();
            const aiHTML = `
                <div class="message-wrapper ai" id="${loadingId}">
                    <div class="message-content">
                        <div class="avatar ai-avatar">☯</div>
                        <div class="text" style="color: var(--gold-dim);">Cultivating response...</div>
                    </div>
                </div>`;
            chatBox.insertAdjacentHTML('beforeend', aiHTML);
            chatBox.scrollTop = chatBox.scrollHeight;

            // 3. Fetch from your Server
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, model: selectedAI }) // Sending selected model info
                });
                const data = await response.json();
                
                // Replace loading text with actual clean response
                document.getElementById(loadingId).querySelector('.text').innerHTML = data.reply || "Connection to the spiritual realm lost.";
                document.getElementById(loadingId).querySelector('.text').style.color = "var(--text-main)";
            } catch (err) {
                document.getElementById(loadingId).querySelector('.text').innerHTML = "Error connecting to the server.";
                document.getElementById(loadingId).querySelector('.text').style.color = "var(--red-wuxia)";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRAFT AI - Wuxia Realm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Wuxia Mystical Atmosphere Background */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712; /* Deep dark blue/black base */
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.15) 0%, transparent 50%), /* Cherry Blossom Pink Glow */
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.15) 0%, transparent 50%),   /* Waterfall Cyan Glow */
                radial-gradient(circle at 50% 50%, rgba(30, 58, 138, 0.1) 0%, transparent 70%);    /* Deep Mountain Blue */
            color: #e2e8f0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating Qi/Energy Particles Container */
        #particles-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            animation: floatUp infinite linear;
            opacity: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.6; }
            80% { opacity: 0.4; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* Premium Glassmorphism Panel */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(6, 182, 212, 0.05);
            z-index: 10;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s ease;
        }
        
        .glass-panel:hover {
            box-shadow: 0 40px 70px -15px rgba(0, 0, 0, 0.9), inset 0 0 40px rgba(236, 72, 153, 0.05);
        }

        /* Silky Smooth Message Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-enter {
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Smooth Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.5); }

        /* Glowing Inputs & Buttons */
        .input-glow {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-glow:focus {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.25), inset 0 0 10px rgba(6, 182, 212, 0.1);
            border-color: rgba(6, 182, 212, 0.6);
            background: rgba(15, 23, 42, 0.8);
        }

        .btn-glow {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Background Animated Particles -->
    <div id="particles-container"></div>

    <!-- Main Chat Container -->
    <div class="glass-panel w-full max-w-2xl h-[90vh] rounded-[2rem] flex flex-col relative overflow-hidden">
        
        <!-- Header with Model Selector -->
        <header class="p-6 border-b border-white/5 flex justify-between items-center bg-white/[0.02] z-10">
            <div>
                <h1 class="text-2xl font-semibold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-pink-400 tracking-wide drop-shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                    CRAFT AI 
                </h1>
                <p class="text-[10px] text-cyan-200/50 mt-1 uppercase tracking-[0.2em]">Neural Realm Connection</p>
            </div>
            
            <!-- AI Engine Switcher -->
            <div class="flex items-center gap-4">
                <select id="ai-model" class="bg-slate-900/60 border border-white/10 text-cyan-100 text-xs rounded-xl px-4 py-2 focus:outline-none focus:border-cyan-500/50 backdrop-blur-md cursor-pointer transition-all hover:border-white/20">
                    <option value="openai">OpenAI Engine</option>
                    <option value="gemini">Gemini Engine</option>
                </select>
                <div class="flex items-center gap-2 px-3 py-2 rounded-full bg-slate-900/50 border border-white/5">
                    <div class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_10px_rgba(34,211,238,0.8)]"></div>
                </div>
            </div>
        </header>

        <!-- Chat Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 z-10 scroll-smooth">
            <div class="flex justify-start message-enter">
                <div class="max-w-[80%] bg-slate-800/40 border border-white/5 rounded-2xl rounded-tl-sm px-6 py-4 shadow-xl backdrop-blur-md relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-cyan-400 to-pink-500"></div>
                    <p class="text-sm text-slate-200 leading-relaxed font-light">
                        System initialized. The connection to the AI realm is stable. Select your engine and enter your query below.
                    </p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-5 border-t border-white/5 bg-slate-950/40 z-10 backdrop-blur-xl">
            <form id="chat-form" class="relative flex items-center">
                <input 
                    type="text" 
                    id="user-input"
                    class="w-full bg-slate-900/40 border border-white/10 text-white text-sm rounded-2xl px-6 py-4 focus:outline-none input-glow placeholder-slate-500"
                    placeholder="Focus your intent..."
                    autocomplete="off"
                >
                <button 
                    type="submit"
                    class="btn-glow absolute right-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white rounded-xl px-5 py-2.5 text-sm font-medium flex items-center gap-2"
                >
                    <span class="tracking-wide">Send</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        // --- 1. Background Particles Logic ---
        function createParticles() {
            const container = document.getElementById('particles-container');
            const particleCount = 20; // Number of floating lights/petals
            
            for (let i = 0; i < particleCount; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                
                // Randomize size, position, color (cyan or pink), and speed
                let size = Math.random() * 6 + 2; 
                let posX = Math.random() * 100;
                let duration = Math.random() * 10 + 10;
                let delay = Math.random() * 10;
                let isPink = Math.random() > 0.7;
                
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = posX + '%';
                particle.style.animationDuration = duration + 's';
                particle.style.animationDelay = delay + 's';
                
                if(isPink) {
                    particle.style.background = 'radial-gradient(circle, rgba(236,72,153,0.8) 0%, rgba(236,72,153,0) 70%)';
                } else {
                    particle.style.background = 'radial-gradient(circle, rgba(6,182,212,0.8) 0%, rgba(6,182,212,0) 70%)';
                }
                
                container.appendChild(particle);
            }
        }
        createParticles();

        // --- 2. Chat UI & API Logic ---
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const modelSelect = document.getElementById('ai-model');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim();
            const selectedModel = modelSelect.value;
            
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';

            const loadingId = addLoadingMessage();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: message, engine: selectedModel })
                });

                const data = await response.json();
                removeMessage(loadingId);

                if (response.ok) {
                    addMessage(data.reply || data.message, 'ai');
                } else {
                    addMessage(data.error || "Server processing error. Check backend logs.", 'error');
                }
            } catch (error) {
                removeMessage(loadingId);
                addMessage("Connection Interrupted: The neural link to the backend server failed. Ensure your Render backend is active.", 'error');
            }
        });

        function addMessage(text, sender) {
            const wrapper = document.createElement('div');
            wrapper.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'} message-enter mb-6`;
            
            if (sender === 'user') {
                wrapper.innerHTML = `
                    <div class="max-w-[80%] bg-gradient-to-br from-cyan-700/30 to-blue-900/30 border border-cyan-400/20 rounded-2xl rounded-tr-sm px-6 py-4 shadow-[0_10px_25px_-5px_rgba(6,182,212,0.15)] backdrop-blur-md">
                        <p class="text-sm text-cyan-50 leading-relaxed font-light">${text}</p>
                    </div>`;
            } else if (sender === 'error') {
                wrapper.innerHTML = `
                    <div class="max-w-[80%] bg-pink-900/20 border border-pink-500/20 rounded-2xl rounded-tl-sm px-6 py-4 shadow-xl backdrop-blur-md">
                        <p class="text-sm text-pink-200 leading-relaxed font-light">${text}</p>
                    </div>`;
            } else {
                wrapper.innerHTML = `
                    <div class="max-w-[80%] bg-slate-800/40 border border-white/5 rounded-2xl rounded-tl-sm px-6 py-4 shadow-xl backdrop-blur-md relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-1 h-full bg-gradient-to-b from-cyan-400 to-pink-500"></div>
                        <p class="text-sm text-slate-200 leading-relaxed font-light">${text}</p>
                    </div>`;
            }

            chatBox.appendChild(wrapper);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
        }

        function addLoadingMessage() {
            const id = 'loading-' + Date.now();
            const wrapper = document.createElement('div');
            wrapper.id = id;
            wrapper.className = `flex justify-start message-enter mb-6`;
            wrapper.innerHTML = `
                <div class="bg-slate-800/40 border border-white/5 rounded-2xl rounded-tl-sm px-6 py-4 shadow-xl backdrop-blur-md flex gap-2 items-center">
                    <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce shadow-[0_0_8px_rgba(34,211,238,0.8)]"></div>
                    <div class="w-1.5 h-1.5 bg-pink-400 rounded-full animate-bounce shadow-[0_0_8px_rgba(236,72,153,0.8)]" style="animation-delay: 0.15s"></div>
                    <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-bounce shadow-[0_0_8px_rgba(34,211,238,0.8)]" style="animation-delay: 0.3s"></div>
                </div>`;
            chatBox.appendChild(wrapper);
            chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
            return id;
        }

        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>

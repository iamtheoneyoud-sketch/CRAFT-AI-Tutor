<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071418">
  <meta name="color-scheme" content="dark">
  <title>CRAFT AI Tutor — Wuxia Learning Realm</title>

  <style>
    :root {
      --ink: #f4f0e6;
      --ink-soft: rgba(244,240,230,.72);
      --ink-faint: rgba(244,240,230,.48);
      --jade: #93d8c0;
      --jade-bright: #b8f0dc;
      --cyan: #77dce2;
      --gold: #c5a059;
      --gold-bright: #e4cb90;
      --deep: #030a0d;
      --line: rgba(197,160,89,.28);
      --line-soft: rgba(220,244,236,.12);
      --danger: #e7a4a4;
      --shadow: 0 28px 90px rgba(0,0,0,.42);
      --radius-xl: 30px;
    }

    * { box-sizing: border-box; }
    html, body { width:100%; height:100%; margin:0; }
    body {
      min-height: 100%;
      overflow: hidden;
      color: var(--ink);
      background: var(--deep);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    /* Background World */
    .world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #02070a;
      z-index: 0;
    }
    .world-canvas {
      position: absolute;
      inset: -3%;
      width: 106%;
      height: 106%;
      z-index: 0;
    }

    /* Shell Layout */
    .shell {
      position: relative;
      z-index: 10;
      display: grid;
      grid-template-columns: 276px minmax(0,1fr);
      gap: 14px;
      width: 100%;
      height: 100%;
      padding: 14px;
    }

    .glass {
      background: linear-gradient(180deg, rgba(7,20,23,.75), rgba(3,12,15,.85));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(20px);
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-xl);
      padding: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 16px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: var(--gold-bright);
      border: 1px solid rgba(197,160,89,.46);
      background: linear-gradient(145deg, rgba(197,160,89,.18), rgba(86,145,132,.10));
      font-family: Georgia, serif;
      font-size: 20px;
    }

    .brand h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .16em;
      font-family: Georgia, serif;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .side-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(197,160,89,.34), transparent);
      margin: 4px 0 14px;
    }

    .new-chat {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(197,160,89,.34);
      border-radius: 15px;
      padding: 11px 13px;
      background: rgba(197,160,89,.1);
      cursor: pointer;
      color: var(--ink);
    }

    .side-title {
      margin: 20px 4px 8px;
      color: var(--ink-faint);
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .realm-list {
      display: grid;
      gap: 7px;
    }

    .realm-btn {
      border: 1px solid transparent;
      background: rgba(255,255,255,.025);
      padding: 10px 11px;
      border-radius: 13px;
      text-align: left;
      cursor: pointer;
      color: rgba(244,240,230,.72);
    }
    .realm-btn.active {
      background: rgba(119,220,226,.075);
      border-color: rgba(119,220,226,.18);
      color: var(--ink);
    }

    /* Main Chat Area */
    .main {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 17px;
      border-bottom: 1px solid var(--line-soft);
      background: rgba(4,15,18,.6);
    }

    .status-orb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--jade-bright);
      box-shadow: 0 0 18px rgba(184,240,220,.64);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .realm-heading h2 {
      margin: 0;
      font-size: 14px;
    }
    .realm-heading span {
      font-size: 10px;
      color: var(--ink-faint);
    }

    .ai-select {
      border: 1px solid rgba(197,160,89,.30);
      border-radius: 12px;
      color: var(--gold-bright);
      background: rgba(4,14,17,.8);
      padding: 9px 12px;
      outline: none;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .ai-select option { background: #081116; color: #f2ead9; }

    .chat-scroll {
      flex: 1;
      overflow: auto;
      padding: 26px clamp(12px, 4vw, 54px);
    }

    .welcome {
      max-width: 800px;
      margin: 4vh auto 20px;
      text-align: center;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid rgba(197,160,89,.25);
      background: rgba(4,13,17,.5);
    }
    .welcome h3 {
      font-family: Georgia, serif;
      font-size: 28px;
      margin: 10px 0;
    }
    .welcome p { color: var(--ink-soft); font-size: 13px; }

    .messages {
      max-width: 900px;
      margin: 0 auto;
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(197,160,89,.3);
      background: #061114;
      color: var(--gold-bright);
    }

    .message-text {
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(3,11,14,.6);
      border: 1px solid rgba(197,160,89,.2);
      max-width: 75%;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .message.user .message-text {
      background: rgba(239,156,199,.12);
      border-color: rgba(239,156,199,.2);
    }

    /* Composer */
    .composer-wrap {
      padding: 12px clamp(12px, 4vw, 54px);
      background: rgba(3,11,14,.6);
    }
    .composer {
      max-width: 900px;
      margin: 0 auto;
      border-radius: 16px;
      border: 1px solid rgba(197,160,89,.3);
      background: rgba(8,18,21,.8);
      display: flex;
      flex-direction: column;
    }
    .composer textarea {
      width: 100%;
      min-height: 50px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 14px;
      font-size: 14px;
    }
    .composer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px 10px;
    }
    .send-btn {
      border: 1px solid rgba(197,160,89,.4);
      border-radius: 10px;
      padding: 8px 16px;
      cursor: pointer;
      color: #09100f;
      font-weight: 800;
      background: linear-gradient(145deg, #e5cf95, #b68c3f);
    }

    @media (max-width: 768px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

  <div class="world">
    <canvas class="world-canvas" id="bgCanvas"></canvas>
  </div>

  <div class="shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="brand-mark">武</div>
        <div>
          <h1>CRAFT AI</h1>
          <p>Wuxia Learning Realm</p>
        </div>
      </div>
      <div class="side-divider"></div>
      <button class="new-chat" id="newChatBtn">
        <span>+ New Dao Path</span>
      </button>
      <div class="side-title">Realms of Study</div>
      <div class="realm-list">
        <button class="realm-btn active">📜 Concept Mastery</button>
        <button class="realm-btn">🗡 Active Recall</button>
        <button class="realm-btn">☯ Problem Solving</button>
      </div>
    </aside>

    <main class="main glass">
      <header class="topbar">
        <div class="topbar-left">
          <div class="status-orb"></div>
          <div class="realm-heading">
            <h2>Concept Mastery Realm</h2>
            <span>Dual AI Engine Connected</span>
          </div>
        </div>
        <div class="controls">
          <select class="ai-select" id="personaSelect">
            <option value="grandmaster">⛩ Grandmaster AI</option>
            <option value="scholar">📜 Scholar AI</option>
            <option value="warrior">⚔ Warrior AI</option>
          </select>
        </div>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="welcome" id="welcomeBox">
          <h3>Welcome to CRAFT Wuxia Realm</h3>
          <p>Ask any complex topic or concept. Your AI guide is ready.</p>
        </div>
        <div class="messages" id="messagesContainer"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer">
          <textarea id="messageInput" placeholder="Ask your question here..." rows="1"></textarea>
          <div class="composer-bar">
            <span style="font-size: 10px; color: var(--ink-faint);">Press Enter to send</span>
            <button class="send-btn" id="sendBtn">Send ⚔</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Canvas Background Particles
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.2,
        speed: Math.random() * 0.2 + 0.05
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(p => {
        p.y -= p.speed;
        if (p.y < 0) p.y = height;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(184, 240, 220, ${p.alpha})`;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();

    // Chat Logic
    const messagesContainer = document.getElementById('messagesContainer');
    const welcomeBox = document.getElementById('welcomeBox');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const personaSelect = document.getElementById('personaSelect');
    const chatScroll = document.getElementById('chatScroll');

    function appendMessage(role, text) {
      if (welcomeBox) welcomeBox.style.display = 'none';
      const msg = document.createElement('div');
      msg.className = `message ${role === 'user' ? 'user' : 'assistant'}`;
      
      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? '👤' : '☯';

      const txt = document.createElement('div');
      txt.className = 'message-text';
      txt.textContent = text;

      if (role === 'user') {
        msg.appendChild(txt);
        msg.appendChild(avatar);
      } else {
        msg.appendChild(avatar);
        msg.appendChild(txt);
      }
      messagesContainer.appendChild(msg);
      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    async function handleSend() {
      const text = messageInput.value.trim();
      if (!text) return;
      messageInput.value = '';
      appendMessage('user', text);

      sendBtn.disabled = true;
      sendBtn.textContent = '...';

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, model: personaSelect.value })
        });
        const data = await res.json();
        appendMessage('assistant', data.reply || 'Qi error occurred.');
      } catch (err) {
        appendMessage('assistant', 'Server connection failed.');
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'Send ⚔';
      }
    }

    sendBtn.addEventListener('click', handleSend);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    document.getElementById('newChatBtn').addEventListener('click', () => {
      messagesContainer.innerHTML = '';
      if (welcomeBox) welcomeBox.style.display = 'block';
    });
  </script>
</body>
          </html>
